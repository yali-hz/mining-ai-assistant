<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>矿业智询 · AI智能助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/chat.js"></script>
</head>
<body>
  <main class="phone">
    <header class="navigation"><h1>矿业智询</h1><span class="demo">演示版</span></header>
    <div class="content" id="content">
      <section class="intro" aria-labelledby="assistant-title">
        <div class="intro-heading"><span class="sparkle" aria-hidden="true">✦</span><h2 id="assistant-title">问清规则，查明业务</h2></div>
        <p>从知识原文查要求，从业务记录核事实。一个问题可以一起查，也可以接着追问。</p>
        <div class="capabilities"><span>原文依据</span><span>连续追问</span><span>组合查询</span></div>
      </section>
      <section class="suggestions" aria-labelledby="suggestion-title">
        <h2 id="suggestion-title">从一个问题开始</h2>
        <p class="suggestion-hint">点击示例即可查询，支持换成你关心的对象。</p>
        <div class="question-group" role="group" aria-labelledby="group-0">
          <h3 id="group-0">知识问答<span>查报送要求与业务口径，核对知识原文</span></h3>
          <button type="button" data-question="储量年报最晚什么时候交？请给出原文依据。"><span class="question-icon" aria-hidden="true">知</span><span class="example-copy"><strong>储量年报最晚什么时候交？</strong><small>报送期限 · 查看原文依据</small></span><span class="chevron" aria-hidden="true">›</span></button>
          <button type="button" data-question="储量年报和卤水监测年报分别针对什么对象？"><span class="question-icon" aria-hidden="true">知</span><span class="example-copy"><strong>两类年报分别针对什么对象？</strong><small>储量年报与卤水监测年报 · 对比口径</small></span><span class="chevron" aria-hidden="true">›</span></button>
          <p class="followup-hint">可以接着问：那需要准备哪些材料？<br>检索材料不足时，会说明无法确认。</p>
        </div>
        <div class="question-group" role="group" aria-labelledby="group-1">
          <h3 id="group-1">业务查询<span>查对象与关联关系，核对报告提交和逾期</span></h3>
          <button type="button" data-question="青海盐湖示例矿业有限公司的基本信息是什么？"><span class="question-icon" aria-hidden="true">查</span><span>青海盐湖示例矿业有限公司的基本信息是什么？</span><span class="chevron" aria-hidden="true">›</span></button>
          <button type="button" data-question="察尔汗一号盐湖矿山有哪些生产线，共几条？"><span class="question-icon" aria-hidden="true">查</span><span class="example-copy"><strong>这座矿山有哪些生产线？</strong><small>察尔汗一号盐湖矿山 · 关联名称与数量</small></span><span class="chevron" aria-hidden="true">›</span></button>
          <button type="button" data-question="察尔汗一号盐湖矿山2024年储量年报是否逾期？请说明判断依据。"><span class="question-icon" aria-hidden="true">核</span><span class="example-copy"><strong>2024 年储量年报是否逾期？</strong><small>察尔汗一号盐湖矿山 · 按日期核对</small></span><span class="chevron" aria-hidden="true">›</span></button>
          <button class="combined-example" type="button" data-question="请一起查询察尔汗一号盐湖矿山的面积、关联生产线名称和数量，以及2024年储量年报是否逾期。"><span class="question-icon" aria-hidden="true">合</span><span class="example-copy"><strong>面积、生产线、年报逾期一起查</strong><small>察尔汗一号盐湖矿山 · 一次完成三个查询</small></span><span class="chevron" aria-hidden="true">›</span></button>
          <p class="followup-hint">查完年报后可以接着问：那 2030 年的呢？</p>
        </div>
        <p class="suggestion-hint data-hint">业务查询使用虚拟示例数据；查询其他对象时，请填写完整名称。</p>
      </section>
      <div class="conversation-label">问规则，查信息，从这里开始</div>
      <section id="messages" class="messages" role="log" aria-label="对话消息" aria-live="polite" aria-relevant="additions text"></section>
    </div>
    <footer class="composer">
      <form id="chat-form">
        <label class="sr-only" for="question">请输入您的问题</label>
        <textarea id="question" rows="1" maxlength="1000" placeholder="输入规则问题或企业、矿山名称…" enterkeyhint="send"></textarea>
        <button id="send" type="submit" aria-label="发送问题" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
      <p class="disclaimer">课程演示 · 数据与规则为虚拟示例 · 缺记录不等于未提交</p>
    </footer>
  </main>
</body>
</html>
