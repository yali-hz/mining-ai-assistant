    - data:
        code: "function main({ entity_type, entity_keyword, report_type_name, year,\
          \ query_mode, question }) {\n  const clean = (val) => (val == null ? \"\"\
          \ : String(val)\n    .replace(/[{}]/g, \"\")\n    .replace(/\\r\\n|\\r|\\\
          n/g, \" \")\n    .replace(/\\s+/g, \" \")\n    .trim());\n\n  // ★ v3.1：本文件不出现感叹号字符，避免粘贴时被转义成反斜杠+感叹号报\
          \ SyntaxError\n  const VALID_ENTITY = [\"mine\", \"production_line\", \"\
          enterprise\"];\n  let et = clean(entity_type).toLowerCase();\n  if (VALID_ENTITY.indexOf(et)\
          \ < 0) et = \"mine\";\n  const kw = clean(entity_keyword).replace(/\\s+/g,\
          \ \"\").slice(0, 200);\n\n  const VALID_MODE = [\"report_risk\", \"license\"\
          , \"general\"];\n  let mode = clean(query_mode).toLowerCase();\n  if (VALID_MODE.indexOf(mode)\
          \ < 0) mode = \"general\";\n\n  // ★ 代码层兜底纠正：模型对 license / report_risk 的区分不稳定，\n\
          \  //   这里用原问题里的关键词做一次确定性仲裁，避免\"问证照却核报告\"这类答非所问。\n  //   规则：出现报告词 → report_risk；无报告词且出现证照词\
          \ → license；都不沾 → 保持原判。\n  if (mode === \"report_risk\" || mode === \"license\"\
          ) {\n    const q = clean(question);\n    if (q) {\n      const REPORT_WORDS\
          \ = [\"报告\", \"年报\", \"储量\", \"开发利用\", \"国情\", \"卤水\", \"监测年报\"];\n    \
          \  const LICENSE_WORDS = [\"证照\", \"采矿证\", \"采矿许可证\", \"许可证\", \"有效\", \"\
          到期\", \"临期\", \"过期\", \"延续\"];\n      const hasReport = REPORT_WORDS.some(function\
          \ (w) { return q.indexOf(w) >= 0; });\n      const hasLicense = LICENSE_WORDS.some(function\
          \ (w) { return q.indexOf(w) >= 0; });\n      if (hasReport) mode = \"report_risk\"\
          ;\n      else if (hasLicense) mode = \"license\";\n    }\n  }\n\n  // ★\
          \ 缺矿名：追问，不要拿空关键词硬查（空关键词会被后端 400 拒绝 → 断流无输出）\n  // general 是\"有哪些风险\"这类天然无具体对象的问法，允许缺名；report_risk\
          \ / license 必须有对象\n  if (!kw && mode !== \"general\") {\n    // ★ 保留原意图：need_entity\
          \ 只表示\"缺名称\"，不能把 report_risk / license 抹成中性，\n    //   否则补全引导会丢掉\"查证照\"\
          还是\"查报告\"的区分\n    return {\n      mode: \"need_entity\",\n      need_mode:\
          \ mode,\n      skip_api: true,\n      entity_type: et, entity_keyword: \"\
          \", year: clean(year), report_type_name: clean(report_type_name),\n    \
          \  json_body: \"\"\n    };\n  }\n\n  // —— report_risk：把报告记录当作\"风险信号\"输入（事实答案走\
          \ 06-B）——\n  if (mode === \"report_risk\") {\n    // ★ 报告类型：映射到真实中文取值（默认\"\
          储量年报\"，即矿山唯一拥有的报告类型）\n    const REPORT_TYPE_MAP = {\n      \"储量\": \"储量年报\"\
          , \"储量年报\": \"储量年报\", \"年报\": \"储量年报\", \"reserve\": \"储量年报\", \"annual\"\
          : \"储量年报\",\n      \"开发利用\": \"年度开发利用报告\", \"年度开发利用\": \"年度开发利用报告\", \"\
          开发报告\": \"年度开发利用报告\",\n      \"年度开发利用报告\": \"年度开发利用报告\",\n      \"国情\":\
          \ \"国情调查报告\", \"国情调查\": \"国情调查报告\", \"国情调查报告\": \"国情调查报告\",\n      \"卤水\"\
          : \"卤水监测年报\", \"卤水监测\": \"卤水监测年报\", \"监测\": \"卤水监测年报\", \"卤水监测年报\": \"卤水监测年报\"\
          \n    };\n    let rtName = clean(report_type_name);\n    rtName = REPORT_TYPE_MAP[rtName]\
          \ || REPORT_TYPE_MAP[rtName.toLowerCase()] || \"储量年报\";\n\n    // ★ 缺省取「最新可查年度」而非当前年：数据年度为\
          \ 2023/2024/2025，\n    //   当前年已是 2026，用 new Date().getFullYear() 会必然查不到（BC-008\
          \ 连带问题）\n    const LATEST_YEAR = 2025;\n    let y = Number((clean(year).match(/(\\\
          d{4})/) || [])[1] || LATEST_YEAR);\n    if (y < 1900 || y > 2100) y = LATEST_YEAR;\n\
          \n    return {\n      mode: \"report_risk\",\n      need_mode: \"\",\n \
          \     skip_api: false,\n      entity_type: et, entity_keyword: kw, year:\
          \ String(y), report_type_name: rtName,\n      json_body: JSON.stringify({\n\
          \        entity_type: et, entity_keyword: kw, resource_type: \"report\"\
          ,\n        report_type_name: rtName, year: y, requested_field: \"status\"\
          , query_intent: \"status\"\n      })\n    };\n  }\n\n  // —— license：证照临期/过期，查\
          \ valid_to 后由下游算剩余天数 ——\n  // 证照字段只在矿山白名单里；生产线/企业没有，直接降级\n  // license 模式只支持矿山：证照字段只在\
          \ mine 白名单里，生产线/企业直接降级\n  const LICENSE_ENTITY = [\"mine\"];\n  if (mode\
          \ === \"license\" && LICENSE_ENTITY.indexOf(et) < 0) {\n    return { mode:\
          \ \"general\", need_mode: \"\", skip_api: true, json_body: \"\",\n     \
          \        entity_type: et, entity_keyword: kw, year: clean(year), report_type_name:\
          \ clean(report_type_name) };\n  }\n  if (mode === \"license\") {\n    return\
          \ {\n      mode: \"license\",\n      need_mode: \"\",\n      skip_api: false,\n\
          \      entity_type: et, entity_keyword: kw, year: clean(year), report_type_name:\
          \ clean(report_type_name),\n      json_body: JSON.stringify({\n        entity_type:\
