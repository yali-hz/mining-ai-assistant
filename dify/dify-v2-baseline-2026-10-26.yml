    - data:
        desc: ''
        instruction: "你负责解析用户关于矿山/企业「风险、异常、合规、证照」的查询，并输出路由模式 query_mode。\n\n本分支同时承接两类提问：①\
          \ 风险汇总（\"有什么风险/异常\"→ general）；② 具体合规判断（\"某年某报告是否逾期\"→ report_risk；\"证照是否临期/过期\"\
          → license）。注意分工：如果用户只是问\"某年某报告交了没/提交了吗\"这类纯事实问题，\n那是另一个分支（业务查询）的职责，本分支请把\
          \ query_mode 输出为 \"general\"。\n\n提取字段：\n1. entity_type: 实体类型，默认 \"mine\"\
          ，提到生产线填 \"production_line\"，提到公司/企业填 \"enterprise\"\n2. entity_keyword:\
          \ 实体名称，只保留核心名称——去掉\"矿山/矿/盐湖矿/企业/公司\"等通用后缀，例如\"察尔汗一号矿山\"→\"察尔汗一号\"、\"察尔汗一号盐湖矿山\"\
          →\"察尔汗一号盐湖\"；不要按简称缩写（\"察尔汗一号盐湖矿山\"不能写成\"察尔汗一号\"以外的更短形式）\n3. report_type_name:\
          \ 输出中文标准名——\"储量年报\" / \"年度开发利用报告\" / \"国情调查报告\" / \"卤水监测年报\"；\n   泛称\"年报\"\
          \"报告\"默认 \"储量年报\"；不要输出英文\n4. year: 四位年份如 \"2024\"；未提及时留空（清洗节点填最新可查年度 2025，可查范围\
          \ 2023/2024/2025）；不要带\"年\"字\n5. query_mode: 按用户意图分类（**先看问题里有没有\"报告/年报/报告类型名\"\
          ，再看有没有\"证照/许可证\"**）——\n   ⚠ 判定顺序（必须按这个顺序）：\n   (1) 问题里出现\"报告 / 年报 / 储量年报\
          \ / 开发利用报告 / 国情调查 / 卤水监测\"等报告词 → \"report_risk\"（除非同时出现\"证照/许可证\"，见下方混合规则）\n\
          \   (2) 问题里**没有**任何报告词，且出现\"证照 / 采矿证 / 采矿许可证 / 许可证 / 有效期 / 到期 / 临期 / 过期\"\
          \ → \"license\"\n   (3) 都不满足且是\"风险/异常/关注事项\" → \"general\"\n   ⚠ 只问证照（如\"\
          采矿证快到期了吗\"\"证照还有多久到期\"）绝对不要判成 report_risk——那会去查报告，属于答非所问。\n   - 问\"报告有没有逾期\
          \ / 逾期了吗\"（作为风险信号）→ \"report_risk\"\n   - 问\"证照快到期了吗 / 采矿证什么时候到期 / 证照有效期到什么时候\
          \ / 证照过期了吗 / 还有多久到期\" → \"license\"\n   ⚠ 只要提到\"证照/采矿证/许可证 + 到期/有效期/临期/过期\"\
          就是 license，不要判成 report_risk\n   - 问\"有什么风险 / 有哪些风险 / 异常事项 / 需要关注的问题 / 合规风险\
          \ / 哪些年报还没提交\" → \"general\"\n\n重要约束：\n- \"哪些年报还没提交\" 是跨年度聚合，后端不支持 list，必须输出\
          \ \"general\" 走降级，不要拆成 report_risk。\n- \"风险/异常/关注事项\" 一律归为 general，不要试图拆成具体字段或\
          \ risk 意图。\n- 若用户同时问\"证照临期 或 报告逾期\"，query_mode 给 \"report_risk\"（报告部分可查，证照部分由回答节点补充）。\n\
          - 不要输出 report/entity/relation、list/attribute 等技术字段，路由交给下游清洗节点。"
        isInIteration: false
        isInLoop: false
