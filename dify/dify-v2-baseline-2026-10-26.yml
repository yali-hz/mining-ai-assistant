    - data:
        code: "function main({ risk, report_type_name, year }) {\n  // ★ 变量必须在本函数内自行准备（Dify\
          \ 会注入全部上下文变量，但不能依赖未声明的名字）\n  let risk_level = \"unknown\", risk_reason =\
          \ \"\", is_overdue = false, has_record = false;\n  let report_status = \"\
          \", due_date = \"\", submitted_at = \"\", message = \"\";\n  // 报告类型/年度：入参已由节点\
          \ variables 注入（R-格式清洗.report_type_name / .year），\n  // 后端回显更准确时优先用回显值。取不到才用中性兜底词（不硬编码任何报告类型名）。\n\
          \  report_type_name = report_type_name || \"\";\n  year = year || \"\";\n\
          \  try {\n    const b = JSON.parse(risk);\n    if (b && b.success && b.data)\
          \ {\n      const d = b.data;\n      has_record = d.record_found === true;\n\
          \      report_status = d.status || \"\";\n      due_date = d.due_date ||\
          \ \"\";\n      submitted_at = d.submitted_at || \"\";\n      is_overdue\
          \ = d.is_overdue === true;\n      message = d.message || \"\";\n      report_type_name\
          \ = d.report_type_name || d.report_type || report_type_name || \"\";\n \
          \     year = d.requested_year || d.year || d.query_year || year || \"\"\
          ;\n      if (has_record === false) {\n        // ★ 区分两种情况（都不判风险，但说法不同）：\n\
          \        //   ① 该矿山该报告类型在本年度没记录 → 可能只是这一年没登记\n        //   ② 该矿山该报告类型在系统内完全没有登记\
          \ → 换年度也查不到，需要说明并建议改查\n        //   判断依据：后端返回的 requested_year 与 year 是否一致（回退年份说明该类型无该年度记录），\n\
          \        //   以及 status 是否为 unknown。这里不硬编码任何报告类型名，只描述\"是否存在登记\"。\n     \
          \   risk_level = \"unknown\";\n        if (report_status === \"unknown\"\
          \ || report_status === \"\") {\n          const type_text = report_type_name\
          \ ? `「${report_type_name}」` : \"这类报告\";\n          const year_text = year\
          \ ? `${year} 年度` : \"所查年度\";\n          risk_reason = `系统内未查到该矿山${type_text}在\
          \ ${year_text} 的登记记录；`\n            + `如果该矿山从未登记过这类报告，换其他年度也不会有结果，建议改查该矿山有登记记录的报告类型。`;\n\
          \        } else {\n          risk_reason = message || \"未找到该年度报告记录，无法判断逾期状态\"\
          ;\n        }\n      } else if (report_status === \"late_submitted\") {\n\
          \        // ★ 逾期补交：已交但超期 —— 中等风险，不能说\"没交\"\n        risk_level = \"medium\"\
          ;\n        risk_reason = `报告已于 ${submitted_at} 补交，但晚于截止日期 ${due_date}，存在逾期记录`;\n\
          \      // ★ 有提交日期且逾期 = 逾期补交（medium），绝不能说成\"逾期未提交\"\n      } else if (submitted_at\
          \ && is_overdue) {\n        risk_level = \"medium\";\n        risk_reason\
          \ = `报告已于 ${submitted_at} 提交（晚于截止日期 ${due_date}），存在逾期补交记录`;\n      // 先判逾期（high）再判未提交（medium）：未提交且已过截止日\
          \ = 逾期未交，不可降级\n      } else if ((is_overdue || report_status === \"overdue\"\
          \ || report_status === \"逾期\") && !submitted_at) {\n        risk_level =\
          \ \"high\";\n        risk_reason = `报告已逾期未提交（截止日期 ${due_date}），存在合规风险`;\n\
          \      } else if (report_status === \"not_submitted\") {\n        risk_level\
          \ = due_date ? \"medium\" : \"unknown\";\n        risk_reason = due_date\n\
          \          ? `报告尚未提交，截止日期 ${due_date}，需关注是否能按时提交`\n          : \"报告未提交且无截止日期，无法判断风险\"\
          ;\n      } else if (report_status === \"submitted\" || report_status ===\
          \ \"已提交\" || report_status === \"uploaded\") {\n        risk_level = \"\
          low\";\n        risk_reason = `报告已于 ${submitted_at} 提交，状态正常`;\n      } else\
          \ if (submitted_at === \"\" && due_date.length > 0) {\n        const now\
          \ = new Date();\n        const due = new Date(due_date);\n        const\
          \ daysLeft = Math.ceil((due - now) / (1000 * 60 * 60 * 24));\n        if\
          \ (daysLeft < 0) { risk_level = \"high\"; risk_reason = `报告已逾期（截止日期 ${due_date}），存在合规风险`;\
          \ is_overdue = true; }\n        else if (daysLeft <= 30) { risk_level =\
          \ \"medium\"; risk_reason = `报告尚未提交，距截止 ${due_date} 还有 ${daysLeft} 天，建议尽快处理`;\
          \ }\n        else { risk_level = \"low\"; risk_reason = `报告尚未提交，距截止 ${due_date}\
          \ 还有 ${daysLeft} 天，时间充裕`; }\n      } else { risk_level = \"unknown\"; risk_reason\
          \ = `报告状态为 ${report_status}，无法判定风险`; }\n    } else if (b && b.error) {\n\
          \      risk_level = \"unknown\"; risk_reason = b.error.message || \"查询失败\"\
          ; message = b.error.message || \"\";\n    }\n  } catch (e) { risk_level\
          \ = \"unknown\"; risk_reason = \"报告解析失败：\" + String(e); }\n  return { risk_level,\
          \ is_overdue, risk_reason, has_record, report_status, due_date, submitted_at,\
          \ message };\n}"
        code_language: javascript
