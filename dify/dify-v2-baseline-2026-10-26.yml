          , \"卤水监测\": \"卤水监测年报\",\n      \"监测年报\": \"卤水监测年报\", \"监测报告\": \"卤水监测年报\"\
          ,\n      // 兼容英文/错填，避免 LLM 输出 annual 导致查不到\n      \"annual\": \"储量年报\",\
