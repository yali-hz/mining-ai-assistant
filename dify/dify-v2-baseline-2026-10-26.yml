    - data:
        classes:
        - id: '1'
          label: knowledge_query
          name: '用户询问一般性的政策规则、业务规定、材料要求、报送要求、业务概念或状态定义。


            核心判断标准：

            回答这个问题不需要查询某个具体企业、矿山、生产线或某条实际业务记录，只需要查知识库中的通用规则即可。


            典型问题包括：

            - 储量年报什么时候报？

            - 排污许可需要什么材料？

            - 安全生产“三同时”包括哪些资料？

            - 什么叫逾期后补交？

            - 过了截止时间再补交算什么状态？

            - 报告未提交和逾期有什么区别？

            - 矿山合规需要检查哪些维度？


            边界：

            - 如果用户只是询问“规则是什么、某种情况一般如何定义”，属于 knowledge_query。

            - 如果用户要求判断某个具体矿山、某年度、某条报告当前是否逾期或异常，则不属于本类，应归为 compliance_judgement。'
        - id: '2'
          label: business_query
          name: '用户查询具体企业、矿山、生产线、报告等当前结构化业务事实。答案可以直接从业务数据库中查询得到，不需要结合政策规则进行进一步判断。


            典型问题包括：

            - 察尔汗一号盐湖矿山面积多少？

            - 这个矿山有几条生产线？

            - 碳酸锂一号生产线设计产能是多少？

            - 察尔汗一号矿山2026年储量年报提交了吗？

            - 采矿许可证有效期到什么时候？

            - 当前矿山开发状态是什么？


            边界：

            - “报告提交了吗？”属于本类。

            - “报告现在是否逾期？”需要结合规则判断，应归为 compliance_judgement。

            - “这个矿山有哪些异常事项？”属于汇总问题，应归为 risk_query。'
        - id: '1789824613573'
          label: risk_query
          name: '用户要求汇总某个企业、矿山或生产线当前存在的异常、待办、风险或需要关注的事项。通常需要查询多条业务数据并进行聚合。


            典型问题包括：

            - 察尔汗一号矿山现在有什么需要关注的问题？

            - 这个矿山有哪些风险？

            - 帮我看看这个矿山目前有哪些异常事项？

            - 哪些年度报告还没有提交？

            - 这个矿山有哪些逾期、临期的事项？

            - 这个矿山有没有证照临期或者报告逾期？


            边界：

            - “2026年储量年报是否逾期？”只是判断一个具体事项，应归为 compliance_judgement。

            - “这个矿山有哪些逾期、临期、异常事项？”属于本类。

            - “采矿证快到期了吗 / 证照还有多久到期 / 证照过期了吗”是对**单一证照**做判断，不是风险汇总，应归为 compliance_judgement。'
        - id: '1789824614628'
          label: compliance_judgement
          name: '用户要求针对某一个具体业务对象或具体业务记录，结合实时业务数据和规则进行判断。


            核心判断标准：

            需要先获取具体业务事实，再结合知识规则或确定性规则得出结论。


            典型问题包括：

            - 察尔汗一号矿山2026年储量年报现在算逾期吗？

            - 察尔汗一号矿山2026年储量年报是在截止日期后提交的，这条记录属于什么状态？

            - 某矿山采矿权证还有20天到期，当前属于什么状态？

            - 当前矿山处于停产整顿，是否属于异常状态？


            边界：

            - “逾期后补交是什么意思？”属于 knowledge_query。

            - “过了截止时间再补交算什么状态？”如果只是询问一般规则，也属于 knowledge_query。

            - 只有当问题涉及具体对象、具体年度、具体记录或实际当前状态，并要求做判断时，才归为 compliance_judgement。'
        instruction: "分类时，请严格使用以下四个类别名，不要输出其他名称：\n\n1. knowledge_query\n   → 只查通用规则：政策规定、法定时限、报送要求、需要哪些材料、业务概念与状态定义。\n\
          \   → 判断标准：回答不需要查任何具体企业/矿山/生产线的真实记录。\n\n2. business_query\n   → 查具体对象的当前业务事实：面积、矿种、产能、有几条生产线、证照编号与有效期、某年度某类报告是否已提交。\n\
          \   → 判断标准：答案能直接从业务数据库查到，不需要再结合规则做判断。\n\n3. compliance_judgement\n   → 针对某一个具体对象或具体记录做判断：是否逾期、是否临期、属于什么状态、是否异常。\n\
          \   → 判断标准：先取事实，再套确定规则才能得出结论。\n   → 单一证照的到期判断（\"采矿证快到期了吗\"）属于本类，不属于 risk_query。\n\
          \n4. risk_query\n   → 汇总型提问：某个对象\"有哪些风险 / 有哪些异常 / 有哪些待办 / 有哪些需要关注的事项\"。\n\
          \   → 判断标准：需要聚合多条数据或多个维度才答得出来。\n\n关键原则：\n- 分类依据不是问题里出现了什么业务名词，而是\"回答这个问题需要什么能力\"\
          。\n- 四个类别名只能是 knowledge_query / business_query / risk_query / compliance_judgement，不要输出旧名称。\n\
          - 无法判断时输出 knowledge_query。"
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: openrouter/auto
          provider: langgenius/openrouter/openrouter
        query_variable_selector:
        - '1789824457863'
        - query
        selected: false
        title: 问题分类器
        type: question-classifier
        vision:
          enabled: false
      height: 262
      id: '1789824563155'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
