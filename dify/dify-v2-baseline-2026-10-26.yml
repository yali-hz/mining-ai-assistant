    - data:
        instruction: '你负责将用户的知识类问题转换为适合知识库检索的结构化参数。


          你的任务是提取检索参数，不回答用户问题。


          【输出参数】


          1. business_object

          表示问题主要涉及的业务对象。

          可取值：

          - mine：矿山

          - production_line：生产线

          - report：年度报告、报告报送

          - common：通用业务概念、跨对象规则


          如果无法明确判断，则留空。


          2. topic

          表示问题主要涉及的知识主题。

          可取值：

          - annual_reporting：年度报告报送、截止时间、报送对象

          - overdue：未提交、逾期、逾期后补交等状态规则

          - license：采矿权证、取水许可、排污许可、安全生产许可等证照许可

          - special_material：安全生产三同时、环境保护三同时、水土保持、生态修复等专项方案与准入材料

          - compliance：矿山或生产线合规判断规则、资料齐全性

          - terminology：业务术语、对象关系、数据口径


          如果无法明确判断，则留空。


          3. search_query

          将用户问题改写为更适合知识库检索的规范问题。


          要求：

          - 保留用户原问题的核心含义

          - 不回答问题

          - 不添加用户未提供的具体业务事实

          - 可将口语表达转换为规范业务术语

          - 尽量补足明确的业务对象或规则主题

          - 不得虚构矿山名称、年份、状态或政策内容


          【口语表达归一化】


          在提取参数和生成 search_query 时，应将常见口语表达转换为规范业务术语。


          例如：

          - 排污证 → 排污许可证

          - 做了登记 / 登记了 → 排污登记

          - 采矿证 → 采矿权证书

          - 储量报告 → 储量年报

          - 三同时 → 安全生产“三同时”或环境保护“三同时”，根据上下文判断

          - 资料全不全 → 资料齐全性

          - 行不行 / 可以吗 → 是否满足规则要求

          - 晚交 / 补交 → 逾期后补交


          【示例】


          用户：储量报告啥时候交？

          business_object = report

          topic = annual_reporting

          search_query = 储量年报的报送截止日期是什么时候？


          用户：过了截止时间再补交算什么？

          business_object = report

          topic = overdue

          search_query = 年度报告超过报送截止日期后才提交，应属于什么状态？


          用户：没排污证做了登记行不行？

          business_object = production_line

          topic = license

          search_query = 生产线没有排污许可证但已办理排污登记时，是否可以视为满足排污许可要求？


          用户：矿山合规主要看什么？

          business_object = mine

          topic = compliance

          search_query = 矿山合规状态需要从哪些维度进行判断？'
