    - data:
        code: "function main({ status_code, body }) {\n  const code = Number(status_code);\n\
          \  let err_code = \"\";\n  let err_msg = \"\";\n  try {\n    const b = JSON.parse(body);\n\
          \    if (b && b.error) {\n      err_code = b.error.code || \"\";\n     \
          \ err_msg = b.error.message || \"\";\n    }\n  } catch (e) {}\n\n  const\
          \ is_ok = code === 200;\n  if (is_ok) return { is_ok, err_code: \"\", err_msg:\
          \ \"\", friendly_msg: \"\", guidance: \"\", reply: \"\" };\n\n  const ENTITIES\
          \ = \"现有数据包括：察尔汗一号盐湖矿山、察尔汗二号盐湖矿山、东台盐湖矿山、西台盐湖矿山、大柴旦北部盐湖矿山、都兰南部盐湖矿山；氯化钾一号\
          \ / 二号生产线、碳酸锂示范生产线、氯化镁生产线等；青海盐湖示例矿业有限公司、海西昆仑资源开发有限公司、柴达木盐湖资源有限公司。\";\n \
          \ const ABILITY = \"我可以帮你查：矿山 / 企业 / 生产线的基础信息（矿种、面积、规模、产能、开采状态、证照有效期）、它们之间的归属关系，以及某年度某类报告是否已提交。\"\
          ;\n  const RELATION = \"目前可查的关系有：企业有哪些矿山 / 生产线、矿山有哪些生产线、矿山属于哪个企业、生产线属于哪个矿山或企业。\"\
          ;\n\n  let friendly_msg, guidance;\n\n  if (err_code === \"ENTITY_NOT_FOUND\"\
          ) {\n    friendly_msg = \"没有找到你说的这个矿山 / 生产线 / 企业，可能是名称不完整或字序有出入。\";\n  \
          \  guidance = ENTITIES;\n\n  } else if (err_code === \"MISSING_YEAR\") {\n\
          \    friendly_msg = \"我没听清是哪一年的报告。\";\n    guidance = \"请补上年份再问，例如「察尔汗一号盐湖矿山\
          \ 2024 年储量年报提交了吗」。可查年份为 2024 / 2025 / 2026，报告类型有储量年报、年度开发利用报告、国情调查报告、卤水监测年报。\"\
          ;\n\n  } else if (err_code === \"INVALID_PARAMETER\") {\n    friendly_msg\
          \ = \"这条查询缺少必要信息，比如没说清是哪个矿山或生产线。\";\n    guidance = \"请带上具体的实体名称再问一次。\"\
          ;\n\n  } else if (err_code === \"UNSUPPORTED_QUERY\") {\n    if (/属性字段不支持/.test(err_msg))\
          \ {\n      friendly_msg = \"这个信息项暂时不在可查范围内。\";\n      guidance = ABILITY;\n\
          \    } else if (/不支持该实体关系|关系查询仅支持/.test(err_msg)) {\n      friendly_msg\
          \ = \"这种关联关系暂时查不了。\";\n      guidance = RELATION;\n    } else if (/报告查询仅支持/.test(err_msg))\
          \ {\n      friendly_msg = \"报告查询的条件不完整。\";\n      guidance = \"请按「某实体 +\
          \ 某年份 + 某类报告」的方式提问，例如「察尔汗一号盐湖矿山 2025 年储量年报提交了吗」。\";\n    } else {\n    \
          \  friendly_msg = \"这类查询暂不支持。\";\n      guidance = ABILITY;\n    }\n\n \
          \ } else if (err_code === \"CLOUDBASE_ERROR\" || err_code === \"CLOUDBASE_NOT_CONFIGURED\"\
          \ || code >= 500) {\n    friendly_msg = \"数据服务暂时不可用。\";\n    guidance =\
          \ \"请稍后重试；如果持续失败，请联系系统管理员。\";\n\n  } else if (code === 404 || code === 400)\
          \ {\n    friendly_msg = \"这个查询没能成功执行。\";\n    guidance = ABILITY;\n\n  }\
          \ else {\n    friendly_msg = \"查询失败，请稍后重试。\";\n    guidance = ABILITY;\n\
          \  }\n\n  return {\n    is_ok,\n    err_code,\n    err_msg,\n    friendly_msg,\n\
          \    guidance,\n    reply: friendly_msg + \"\\n\\n\" + guidance\n  };\n\
          }\n"
