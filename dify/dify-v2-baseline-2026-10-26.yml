        - description: '查询模式，三选一，只输出英文单词。

            -report_risk：问某一具体年度的某类报告是否逾期/什么状态（"2026年储量年报逾期了吗"）；

            -license：只问证照有效期/是否临期/是否过期，问题里没有报告词（"采矿证快到期了吗"）；

            -general：问整体有哪些风险/异常/待关注事项，或系统没有的数据（后者走降级回答）。

            判定顺序：先找报告词→report_risk；无报告词且出现证照词→license；否则 general。'
