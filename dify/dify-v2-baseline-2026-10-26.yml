    - data:
        code: "function main({ entity_type, entity_keyword, requested_field, query_mode,\
          \ year, report_type_name }) {\n  // ★ 输出契约：每个分支都必须返回 outputs 里声明的全部键，且类型正确\n\
          \  const base = { entity_type: \"mine\", entity_keyword: \"\", requested_field:\
          \ \"\", year: \"\", report_type_name: \"\" };\n  try {\n    const r = mainInner({\
          \ entity_type, entity_keyword, requested_field, query_mode, year, report_type_name\
          \ }) || {};\n    for (const k in base) { if (r[k] === undefined || r[k]\
          \ === null) r[k] = base[k]; r[k] = String(r[k]); }\n    if (r.json_body\
          \ === undefined || r.json_body === null) r.json_body = \"\";\n    if (r.mode\
          \ === undefined || r.mode === null || r.mode === \"\") r.mode = \"general\"\
          ;\n    r.skip_api = r.skip_api === true;\n    return r;\n  } catch (e) {\n\
          \    // ★ 总兜底：任何异常都不让节点报错断流，统一降级为 general\n    const r = { mode: \"general\"\
          , skip_api: true, json_body: \"\" };\n    for (const k in base) r[k] = base[k];\n\
          \    return r;\n  }\n}\n\nfunction mainInner({ entity_type, entity_keyword,\
          \ requested_field, query_mode, year, report_type_name }) {\n  const clean\
          \ = (val) => (val == null ? \"\" : String(val)\n    .replace(/[{}]/g, \"\
          \")\n    .replace(/\\r\\n|\\r|\\n/g, \" \")\n    .replace(/\\s+/g, \" \"\
          )\n    .trim());\n\n  // ★ v5.1：本文件不出现感叹号字符，避免粘贴时被转义成反斜杠+感叹号报 SyntaxError\n\
          \  const VALID_ENTITY = [\"mine\", \"production_line\", \"enterprise\"];\n\
          \  let et = clean(entity_type).toLowerCase();\n  if (VALID_ENTITY.indexOf(et)\
          \ < 0) et = \"mine\";\n  // 关键词去空白：避免 LLM 输出换行/空格导致 ilike 模糊匹配落空\n  const\
          \ kw = clean(entity_keyword).replace(/\\s+/g, \"\").slice(0, 200);\n\n \
          \ const VALID_MODE = [\"profile\", \"attribute\", \"relation\", \"report\"\
          , \"general\"];\n  let mode = clean(query_mode).toLowerCase();\n  if (VALID_MODE.indexOf(mode)\
          \ < 0) mode = \"profile\";\n\n  // ★ v5.3：缺实体保护——除 general 外，没给实体名就不发请求（空关键词必\
          \ 400 → 无输出）\n  //   general = 问系统没有的数据，降级回答即可，不需要实体\n  if (!kw && mode\
          \ !== \"general\") {\n    return {\n      mode: \"need_entity\", skip_api:\
          \ true,\n      json_body: \"\",\n      entity_type: et, entity_keyword:\
          \ \"\", requested_field: clean(requested_field),\n      year: clean(year),\
          \ report_type_name: clean(report_type_name)\n    };\n  }\n\n  // ★ profile：一次拿全档案，不带\
          \ requested_field\n  if (mode === \"profile\") {\n    return {\n      mode:\
          \ \"profile\", skip_api: false,\n      json_body: JSON.stringify({\n   \
          \     entity_type: et, entity_keyword: kw,\n        resource_type: \"entity\"\
          , query_intent: \"profile\"\n      })\n    };\n  }\n\n  // —— report：报告提交事实查询（v5\
          \ 归 06-B）——\n  // 生成 resource_type=report + query_intent=status + 中文报告类型\
          \ + 整数年份\n  if (mode === \"report\") {\n    const RT = {\n      \"储量年报\"\
          : \"储量年报\", \"年报\": \"储量年报\", \"储量报告\": \"储量年报\", \"储量\": \"储量年报\",\n  \
