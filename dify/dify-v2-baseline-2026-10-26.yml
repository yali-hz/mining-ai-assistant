    - data:
        code: "function main({ license }) {\n  let risk_level = \"unknown\", license_risk_reason\
          \ = \"\";\n  let license_no = \"\", valid_from = \"\", valid_to = \"\",\
          \ days_left = null, expired = false;\n  const THRESHOLD = 180; // 临期阈值：剩余不足\
          \ 180 天视为临期\n  try {\n    const b = JSON.parse(license);\n    const d =\
          \ b && b.success ? b.data : null;\n    if (d === null || d === undefined)\
          \ {\n      if (b && b.error) license_risk_reason = b.error.message || \"\
          查询失败\";\n    } else {\n      license_no = d.mining_license_no || \"\";\n\
          \      valid_from = d.valid_from || \"\";\n      valid_to = d.valid_to ||\
          \ \"\";\n      if (valid_to.length > 0) {\n        const now = new Date();\n\
          \        const end = new Date(valid_to);\n        days_left = Math.ceil((end\
          \ - now) / (1000 * 60 * 60 * 24));\n        if (Number.isNaN(days_left))\
          \ {\n          days_left = null;\n          risk_level = \"unknown\";\n\
          \          license_risk_reason = `证照有效期数据异常（${valid_to}），无法判断临期状态`;\n  \
          \      } else if (days_left < 0) {\n          expired = true; risk_level\
          \ = \"high\";\n          license_risk_reason = `采矿许可证已于 ${valid_to} 过期（超期\
          \ ${-days_left} 天），存在严重合规风险`;\n        } else if (days_left <= THRESHOLD)\
          \ {\n          risk_level = \"medium\";\n          license_risk_reason =\
          \ `采矿许可证将于 ${valid_to} 到期，仅剩 ${days_left} 天，建议尽快办理延续`;\n        } else {\n\
          \          risk_level = \"low\";\n          license_risk_reason = `采矿许可证有效期至\
          \ ${valid_to}，剩余 ${days_left} 天，暂无临期风险`;\n        }\n      } else {\n  \
          \      license_risk_reason = \"未获取到证照有效期，无法判断临期状态\";\n      }\n    }\n \
          \ } catch (e) { license_risk_reason = \"证照解析失败：\" + String(e); }\n  return\
          \ { risk_level, license_risk_reason, license_no, valid_from, valid_to, days_left,\
          \ expired };\n}"
