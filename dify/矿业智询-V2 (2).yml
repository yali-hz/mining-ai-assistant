    - data:
        instruction: '你负责把用户的矿业业务查询转换为统一业务查询 API 所需的结构化参数以及提供给知识检索的结构化参数。


          任务：从用户问题中提取风险判断所需的结构化参数。


          请遵守以下规则：

          1. 只提取用户问题中明确表达或可直接判断的信息，不要臆造对象名称。

          2. entity_type 只允许输出：mine、production_line、enterprise、unknown。

          3. risk_focus 只允许输出：report、license、compliance、overall。

          4. api_query_intent 固定输出 risk。

          5. search_query 要改写成更适合知识库检索的表达，保留核心业务对象、业务事项、风险判断语义。

          6. 如果未识别到明确对象名称，entity_keyword 返回 unknown。

          7. 如果未提及年份，year 返回空字符串。


          示例1：

          用户：察尔汗一号盐湖矿山今年有没有合规风险？

          输出：

          - entity_type = mine

          - entity_keyword = 察尔汗一号盐湖矿山

          - year = ""

          - risk_focus = compliance

          - search_query = 察尔汗一号盐湖矿山合规风险判断规则

          - api_query_intent = risk


          示例2：

          用户：过了截止时间再补交算什么？

          输出：

          - entity_type = unknown

          - entity_keyword = unknown

          - year = ""

          - risk_focus = report

          - search_query = 年度报告逾期后补交状态判定规则

          - api_query_intent = risk


          示例3：

          用户：没排污证做了登记行不行？

          输出：

          - entity_type = production_line

          - entity_keyword = unknown

          - year = ""

          - risk_focus = license

          - search_query = 排污许可二选一规则 排污许可证 排污登记表及回执

          - api_query_intent = risk'
