          \ report\n   - 问系统没有的数据（位置、储量、人数），或问风险/异常/需要关注什么 → general\n4. requested_field：attribute\
          \ 模式填属性中文名；relation 模式填目标类型（矿山/生产线/企业）；其余模式留空。\n5. year + report_type_name：仅\
