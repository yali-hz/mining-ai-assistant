    - data:
        code: "function main({ entity_type, entity_keyword, requested_field, query_mode,\
          \ year, report_type_name }) {\n  const clean = (val) => (val == null ? \"\
          \" : String(val)\n    .replace(/[{}]/g, \"\")\n    .replace(/\\r\\n|\\r|\\\
          n/g, \" \")\n    .replace(/\\s+/g, \" \")\n    .trim());\n\n  // ★ v5.1：本文件不出现感叹号字符，避免粘贴时被转义成反斜杠+感叹号报\
          \ SyntaxError\n  const VALID_ENTITY = [\"mine\", \"production_line\", \"\
          enterprise\"];\n  let et = clean(entity_type).toLowerCase();\n  if (VALID_ENTITY.indexOf(et)\
          \ < 0) et = \"mine\";\n  // 关键词去空白：避免 LLM 输出换行/空格导致 ilike 模糊匹配落空\n  const\
          \ kw = clean(entity_keyword).replace(/\\s+/g, \"\").slice(0, 200);\n\n \
          \ const VALID_MODE = [\"profile\", \"attribute\", \"relation\", \"report\"\
          , \"general\"];\n  let mode = clean(query_mode).toLowerCase();\n  if (VALID_MODE.indexOf(mode)\
          \ < 0) mode = \"profile\";\n\n  // ★ profile：一次拿全档案，不带 requested_field\n\
          \  if (mode === \"profile\") {\n    return {\n      mode: \"profile\", skip_api:\
          \ false,\n      json_body: JSON.stringify({\n        entity_type: et, entity_keyword:\
          \ kw,\n        resource_type: \"entity\", query_intent: \"profile\"\n  \
          \    })\n    };\n  }\n\n  // —— report：报告提交事实查询（v5 归 06-B）——\n  // 生成 resource_type=report\
          \ + query_intent=status + 中文报告类型 + 整数年份\n  if (mode === \"report\") {\n\
          \    const RT = {\n      \"储量年报\": \"储量年报\", \"年报\": \"储量年报\", \"储量报告\"\
          : \"储量年报\", \"储量\": \"储量年报\",\n      \"年度开发利用报告\": \"年度开发利用报告\", \"开发利用报告\"\
          : \"年度开发利用报告\",\n      \"开发报告\": \"年度开发利用报告\", \"利用报告\": \"年度开发利用报告\",\n\
          \      \"国情调查报告\": \"国情调查报告\", \"国情调查\": \"国情调查报告\", \"国情报告\": \"国情调查报告\"\
          ,\n      \"卤水监测年报\": \"卤水监测年报\", \"卤水监测\": \"卤水监测年报\",\n      \"监测年报\":\
          \ \"卤水监测年报\", \"监测报告\": \"卤水监测年报\",\n      // 兼容英文/错填，避免 LLM 输出 annual 导致查不到\n\
          \      \"annual\": \"储量年报\", \"report\": \"储量年报\"\n    };\n    const rawR\
          \ = clean(report_type_name);\n    const rtn = RT[rawR] || RT[rawR.toLowerCase()]\
          \ || \"储量年报\";\n\n    // year：从 \"2024\" / \"2024年\" / \"2024年度\" / \"2024-01-01\"\
          \ 里抠 4 位数字\n    // ★ 缺省取「最新可查年度」而非当前年：数据年度为 2023/2024/2025，\n    //   当前年已是\
          \ 2026，用 new Date().getFullYear() 会必然查不到（BC-008 连带问题）\n    const LATEST_YEAR\
          \ = 2025;\n    const ym = clean(year).match(/(\\d{4})/);\n    const yr =\
          \ ym ? Number(ym[1]) : LATEST_YEAR;\n\n    return {\n      mode: \"report\"\
          , skip_api: false,\n      json_body: JSON.stringify({\n        entity_type:\
          \ et, entity_keyword: kw,\n        resource_type: \"report\", query_intent:\
          \ \"status\",\n        requested_field: \"status\",\n        year: yr,\n\
          \        report_type_name: rtn\n      })\n    };\n  }\n\n  // —— relation：双向关系查询（v3）——\n\
          \  // requested_field 承载\"目标实体类型\"；统一用 list（响应自带 count，问\"几条\"也能答）\n  if\
          \ (mode === \"relation\") {\n    const TARGET = {\n      \"生产线\": \"production_line\"\
          , \"产线\": \"production_line\", \"几条生产线\": \"production_line\", \"production_line\"\
          : \"production_line\",\n      \"矿山\": \"mine\", \"矿\": \"mine\", \"哪个矿山\"\
          : \"mine\", \"mine\": \"mine\",\n      \"企业\": \"enterprise\", \"公司\": \"\
          enterprise\", \"哪个企业\": \"enterprise\", \"所属企业\": \"enterprise\", \"enterprise\"\
          : \"enterprise\"\n    };\n    const rawT = clean(requested_field);\n   \
          \ const tgt = TARGET[rawT] || TARGET[rawT.toLowerCase()] || \"\";\n    if\
          \ (tgt === \"\") {\n      return { mode: \"general\", skip_api: true, json_body:\
          \ \"\" };\n    }\n    return {\n      mode: \"relation\", skip_api: false,\n\
          \      json_body: JSON.stringify({\n        entity_type: et, entity_keyword:\
          \ kw,\n        resource_type: \"relation\", target_type: tgt, query_intent:\
          \ \"list\"\n      })\n    };\n  }\n\n  // —— attribute：中文属性词 → 白名单字段（15\
          \ 个）——\n  if (mode === \"attribute\") {\n    const MAP_MINE = {\n      \"\
          名称\":\"mine_name\",\"矿名\":\"mine_name\",\"mine_name\":\"mine_name\",\n \
          \     \"面积\":\"mine_area_km2\",\"mine_area_km2\":\"mine_area_km2\",\n  \
          \    \"规模\":\"mine_scale\",\"mine_scale\":\"mine_scale\",\n      \"产能\"\
          :\"production_scale\",\"生产规模\":\"production_scale\",\"production_scale\"\
          :\"production_scale\",\n      \"开采状态\":\"development_status\",\"开发状态\":\"\
          development_status\",\"在开采吗\":\"development_status\",\"development_status\"\
          :\"development_status\",\n      \"开采方式\":\"mining_methods\",\"采矿方式\":\"\
          mining_methods\",\"mining_methods\":\"mining_methods\",\n      \"矿种\":\"\
          mineral_types\",\"矿产\":\"mineral_types\",\"mineral_types\":\"mineral_types\"\
          ,\n      \"采矿证号\":\"mining_license_no\",\"证号\":\"mining_license_no\",\"\
          许可证号\":\"mining_license_no\",\"mining_license_no\":\"mining_license_no\"\
          ,\n      \"证照编号\":\"mining_license_no\",\"采矿证\":\"mining_license_no\",\"\
          采矿许可证\":\"mining_license_no\",\n      \"生效日期\":\"valid_from\",\"生效\":\"\
