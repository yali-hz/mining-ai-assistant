          \n严格约束：\n- entity_type 和 query_mode 必须输出英文枚举值，不要输出中文。\n- report_type_name\
          \ 必须输出中文，不要输出英文。\n- 不要编造用户没提到的实体名称。\n- 不要输出任何 JSON 以外的内容。"
