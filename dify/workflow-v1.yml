    - data:
        classes:
        - id: '1'
          label: policy_query
          name: '【政策规则问答】


            用户询问通用的政策规定、法定时间、截止日期、制度要求或法规依据。


            回答此问题只需要查询政策或知识库，不需要查询某个具体企业、矿山、报告的实际业务状态。


            典型问题：

            - 储量年报什么时候提交？

            - 储量年报的法定截止日期是什么？

            - 哪个文件规定了储量年报的提交时间？


            注意：

            如果问题涉及“我们、某企业、某矿山”实际是否已经提交、当前状态等业务数据，不属于本分类。

            如果问题需要根据业务状态进一步判断是否逾期、是否合规，也不属于本分类。'
        - id: '2'
          label: material_query
          name: '【材料 / 流程问答】


            用户询问办理某项业务、提交某项报告时需要准备哪些材料、填写哪些内容、经过什么流程。


            回答此问题主要依赖知识库中的材料要求、办事指南或流程说明，不需要查询当前企业或矿山的实际业务状态。


            典型问题：

            - 储量年报需要准备什么？

            - 提交储量年报需要哪些材料？

            - 储量年报怎么报？

            - 办理这个事项有哪些步骤？'
        - id: '1789824613573'
          label: business_status_query
          name: '【业务状态查询】


            用户正在查询某个具体企业、矿山或当前用户自己的真实业务数据。


            问题重点是查询“事实状态”，例如：

            - 是否已经提交

            - 是否已上传

            - 当前是什么状态

            - 什么时间提交

            - 是否审核通过

            - 还缺哪些已经要求提交的业务数据


            回答此类问题必须查询业务系统或调用 Tool / API，不能仅根据政策知识回答。


            典型问题：

            - 我们今年储量年报提交了吗？

            - 我矿山的储量年报现在是什么状态？

            - 青海XX公司今年的储量年报上传了吗？

            - 我们是什么时候提交的？


            只查询事实状态、不要求判断是否合法或逾期时，归入本分类。'
        - id: '1789824614628'
          label: compliance_judgement
          name: '【合规 / 规则判断】


            用户不仅查询事实，还要求系统根据政策规则、截止日期或业务规则，对当前业务状态作出判断。


            通常需要同时获得：

            1. 政策或规则信息

            2. 当前企业 / 矿山的实际业务数据


            并进行规则判断。


            典型问题：

            - 我们今年还没交，现在算逾期了吗？

            - 我们现在提交还来得及吗？

            - 这个矿山的材料齐全吗？

            - 当前情况是否符合要求？


            如果问题只是问“是否已提交、当前什么状态”，应归入 business_status_query。

            只有需要进一步判断“逾期、合规、齐全、是否符合要求”等结果时，才进入本分类。'
        instruction: "分类时，请按照以下优先级判断：\n\n1. 如果问题要求对当前企业/矿山状态进行合规、逾期、齐全性等判断：\n   →\
          \ compliance_judgement\n\n2. 如果问题需要查询某个具体企业、矿山或当前用户的真实业务状态：\n   → business_status_query\n\
          \n3. 如果问题询问需要准备哪些材料、办理步骤或流程：\n   → material_query\n\n4. 如果问题只是询问通用政策规定、法定时间或政策依据：\n\
          \   → policy_query\n\n关键原则：\n分类依据不是问题中出现了什么业务名词，而是“回答这个问题需要什么能力”。"
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: openrouter/auto
          provider: langgenius/openrouter/openrouter
