    - data:
        instruction: '你负责把用户的矿业业务查询转换为统一业务查询 API 所需的结构化参数。


          你的任务只是提取参数，不回答用户问题。


          【entity_type】

          只能取：

          - enterprise

          - mine

          - production_line


          根据用户主要查询的业务对象判断。


          【entity_keyword】

          提取用户实际提到的实体名称或核心名称，用于后端搜索。

          不要擅自补全不存在的正式名称。


          【resource_type】

          只能取：

          - entity：查询企业、矿山或生产线自身属性

          - relation：查询对象之间的关联关系

          - report：查询挂在企业、矿山或生产线下的报告数据


          【query_intent】

          只能取：

          - attribute：查询单个属性值

          - list：查询关联对象列表

          - count：查询关联对象数量

          - status：查询业务状态


          【requested_field】


          规范字段映射：


          矿山面积 → mine_area_km2

          矿山规模 → mine_scale

          生产规模 → production_scale

          开发状态 → development_status

          开采方式 → mining_methods

          矿种 → mineral_types

          采矿许可证号 → mining_license_no

          许可证开始时间 → valid_from

          许可证到期时间 → valid_to


          设计产能 → design_capacity

          生产工艺 → production_process

          产品类型 → product_types


          生产线 → production_line


          报告状态、是否提交 → status

          实际提交时间 → submitted_at

          截止日期 → due_date


          【year】

          仅在用户明确给出年份时提取数字年份。

          未给出年份时留空。


          【report_type_name】

          将口语报告名称规范化为：

          - 储量年报

          - 卤水监测年报

          - 年度开发利用报告

          - 国情调查报告


          例如：

          储量报告 → 储量年报

          卤水年报 → 卤水监测年报


          【示例】


          用户：察尔汗一号矿山面积多少？

          entity_type = mine

          entity_keyword = 察尔汗一号矿山

          resource_type = entity

          requested_field = mine_area_km2

          query_intent = attribute


          用户：察尔汗一号矿山有几条生产线？

          entity_type = mine

          entity_keyword = 察尔汗一号矿山

          resource_type = relation

          requested_field = production_line

          query_intent = count


          用户：察尔汗一号矿山有哪些生产线？

          entity_type = mine

          entity_keyword = 察尔汗一号矿山

          resource_type = relation

          requested_field = production_line

          query_intent = list


          用户：察尔汗一号矿山2026年储量报告交了吗？

          entity_type = mine

          entity_keyword = 察尔汗一号矿山

          resource_type = report

          requested_field = status

          query_intent = status

          year = 2026

          report_type_name = 储量年报'
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: openrouter/auto
          provider: langgenius/openrouter/openrouter
        parameters:
        - description: '用户问题中的核心业务对象类型。

            只能取：

            - enterprise

            - mine

            - production_line


            如果用户查询“某矿山有哪些生产线”，核心对象仍为 mine。

            如果用户查询某条生产线的年度报告，则为 production_line。'
          name: entity_type
          required: true
          type: string
        - description: '从用户原话中提取用于数据库搜索的实体名称或核心关键词。

            不要自行补全用户未提供的信息。


            例如：

            察尔汗一号矿山面积多少 → 察尔汗一号矿山

            碳酸锂一号生产线产能多少 → 碳酸锂一号生产线'
          name: entity_keyword
          required: true
          type: string
        - description: '用户要查询的数据资源类型。

            只能取：

            - entity：查询实体自身属性

            - relation：查询实体与其他对象的关系

            - report：查询挂在实体下的报告数据'
          name: resource_type
          required: true
          type: string
        - description: '用户希望查询的核心字段或资源。


            字段映射示例：


            矿山面积 → mine_area_km2

            矿山规模 → mine_scale

            生产规模 → production_scale

            开发状态 → development_status

            开采方式 → mining_methods

            矿种 → mineral_types

            采矿许可证号 → mining_license_no

            许可证开始时间 → valid_from

            许可证到期时间 → valid_to

            设计产能 → design_capacity

            生产工艺 → production_process

            产品类型 → product_types

            生产线关系 → production_line

            报告是否提交/报告状态 → status

            报告实际提交时间 → submitted_at

            报告截止时间 → due_date'
          name: requested_field
          required: true
          type: string
        - description: '用户明确提到的年度。

            例如 2026。

            未提及年份时留空，不得自行猜测。'
          name: year
          required: false
          type: string
        - description: '用户询问的报告规范名称。


            可规范为：

            - 储量年报

            - 卤水监测年报

            - 年度开发利用报告

            - 国情调查报告


            用户未查询报告时留空。'
          name: report_type_name
          required: false
          type: string
        - description: '用户希望如何查询该资源。

            只能取：

            - attribute：查询某个属性值

            - list：查询列表

            - count：查询数量

            - status：查询当前状态

            当用户是查询某个具体属性/字段的值（即 requested_field 已填）时，query_intent 一律用 attribute；list
            只用于不带具体字段、列举实体或关系的场景。'
          name: query_intent
          required: true
          type: string
