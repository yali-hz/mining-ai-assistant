    - data:
        code: "function main({ entity_type, entity_keyword, resource_type, requested_field,\
          \ query_intent, year, report_type_name }) {\n  const clean = (val) => (val\
          \ == null ? \"\" : String(val)\n    .replace(/[{}]/g, \"\")\n    .replace(/\\\
          r\\n|\\r|\\n/g, \" \")\n    .replace(/\\s+/g, \" \")\n    .trim());\n\n\
          \  const validEntityType = [\"enterprise\", \"mine\", \"production_line\"\
          ];\n  let et = clean(entity_type).toLowerCase();\n  if (!validEntityType.includes(et))\
          \ et = \"mine\";\n\n  const validResourceType = [\"entity\", \"relation\"\
          , \"report\"];\n  let rt = clean(resource_type).toLowerCase();\n  if (!validResourceType.includes(rt))\
          \ rt = \"entity\";\n\n  const validIntent = [\"attribute\", \"list\", \"\
          count\", \"status\", \"relation\"];\n  let qi = clean(query_intent).toLowerCase();\n\
          \  if (!validIntent.includes(qi)) qi = \"attribute\";\n\n  const body =\
          \ {\n    entity_type: et,\n    entity_keyword: clean(entity_keyword).slice(0,\
          \ 200),\n    resource_type: rt,\n    requested_field: clean(requested_field).slice(0,\
          \ 100),\n    query_intent: qi\n  };\n\n  const y = clean(year);\n  if (y\
          \ && /^\\d{4}$/.test(y)) body.year = y;\n\n  const rpt = clean(report_type_name);\n\
          \  if (rpt) body.report_type_name = rpt;\n\n  return { result: JSON.stringify(body)\
          \ };\n}\n"
